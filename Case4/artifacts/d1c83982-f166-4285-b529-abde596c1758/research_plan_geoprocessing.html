<script>
const details = {"o1_s1_i0": "<h3>Input Data</h3><p><b>Name:</b> NC_tract</p>", "o1_s1_op": "<h3>Step 1.1: extract_centroids</h3><p><b>Operation Type:</b> geoprocessing</p><p><b>Inputs:</b> NC_tract</p><p><b>Output:</b> tract_centroids.gpkg</p><p><b>Description:</b> Generate centroids for census tract geometries</p><p><b>Expected Output:</b> Geospatial file containing centroids for each tract</p>", "o1_s1_out": "<h3>Output Data</h3><p><b>Name:</b> tract_centroids.gpkg</p><p><b>Description:</b> Geospatial file containing centroids for each tract</p>", "o1_s2_i0": "<h3>Input Data</h3><p><b>Name:</b> NC_HW_sites</p>", "o1_s2_op": "<h3>Step 1.2: nearest_neighbor_analysis</h3><p><b>Operation Type:</b> geoprocessing</p><p><b>Inputs:</b> tract_centroids.gpkg, NC_HW_sites</p><p><b>Output:</b> tract_hazard_distance.csv</p><p><b>Description:</b> Calculate distance from tract centroids to nearest hazardous waste facility</p><p><b>Expected Output:</b> Table with GEOID and minimum distance to hazardous waste site</p>", "o1_s2_out": "<h3>Output Data</h3><p><b>Name:</b> tract_hazard_distance.csv</p><p><b>Description:</b> Table with GEOID and minimum distance to hazardous waste site</p>", "o1_s3_i0": "<h3>Input Data</h3><p><b>Name:</b> NC_PLACES</p>", "o1_s3_op": "<h3>Step 1.3: join_datasets</h3><p><b>Operation Type:</b> data_wrangling</p><p><b>Inputs:</b> tract_hazard_distance.csv, NC_PLACES</p><p><b>Output:</b> merged_tract_data.csv</p><p><b>Description:</b> Join tract hazard distances with asthma prevalence data using GEOID</p><p><b>Expected Output:</b> Comprehensive table with spatial metrics and health outcomes</p>", "o1_s3_out": "<h3>Output Data</h3><p><b>Name:</b> merged_tract_data.csv</p><p><b>Description:</b> Comprehensive table with spatial metrics and health outcomes</p>", "o2_s1_i0": "<h3>Input Data</h3><p><b>Name:</b> NC_ACS_data</p>", "o2_s1_op": "<h3>Step 2.1: filter_columns</h3><p><b>Operation Type:</b> data_wrangling</p><p><b>Inputs:</b> NC_ACS_data</p><p><b>Output:</b> filtered_ACS_vars.csv</p><p><b>Description:</b> Select socioeconomic variables: median_household_income, percent_minority, percent_children</p><p><b>Expected Output:</b> Subset of ACS data containing key socioeconomic predictors</p>", "o2_s1_out": "<h3>Output Data</h3><p><b>Name:</b> filtered_ACS_vars.csv</p><p><b>Description:</b> Subset of ACS data containing key socioeconomic predictors</p>", "o2_s2_op": "<h3>Step 2.2: join_datasets</h3><p><b>Operation Type:</b> data_wrangling</p><p><b>Inputs:</b> merged_tract_data.csv, filtered_ACS_vars.csv</p><p><b>Output:</b> final_analysis_dataset.gpkg</p><p><b>Description:</b> Integrate demographic variables with existing spatial and health data using GEOID</p><p><b>Expected Output:</b> Complete spatial dataset containing all required variables</p>", "o2_s2_out": "<h3>Output Data</h3><p><b>Name:</b> final_analysis_dataset.gpkg</p><p><b>Description:</b> Complete spatial dataset containing all required variables</p>", "o2_s3_op": "<h3>Step 2.3: geographically_weighted_regression</h3><p><b>Operation Type:</b> statistical</p><p><b>Inputs:</b> final_analysis_dataset.gpkg</p><p><b>Output:</b> gwr_coefficients.csv</p><p><b>Description:</b> Analyze spatially varying relationships between proximity (hazard_meters), demographics (minority_pct) and asthma (prevalence_rate)</p><p><b>Expected Output:</b> Regression coefficients showing local parameter variations for each variable</p>", "o2_s3_out": "<h3>Output Data</h3><p><b>Name:</b> gwr_coefficients.csv</p><p><b>Description:</b> Regression coefficients showing local parameter variations for each variable</p>", "o3_s1_op": "<h3>Step 3.1: hotspot_analysis</h3><p><b>Operation Type:</b> statistical</p><p><b>Inputs:</b> final_analysis_dataset.gpkg</p><p><b>Output:</b> risk_hotspots.gpkg</p><p><b>Description:</b> Calculate Gi* statistics for combined variables hazard_meters and asthma_prevalence_rate</p><p><b>Expected Output:</b> Geospatial analysis showing Gi* scores and p-values for significant hotspots</p>", "o3_s1_out": "<h3>Output Data</h3><p><b>Name:</b> risk_hotspots.gpkg</p><p><b>Description:</b> Geospatial analysis showing Gi* scores and p-values for significant hotspots</p>", "o3_s2_op": "<h3>Step 3.2: kruskal_wallis_test</h3><p><b>Operation Type:</b> statistical</p><p><b>Inputs:</b> risk_hotspots.gpkg</p><p><b>Output:</b> hotspot_characterization.csv</p><p><b>Description:</b> Compare median minority_pct between hotspot and non-hotspot tracts using Kruskal-Wallis H-test</p><p><b>Expected Output:</b> Test results showing significant differences in minority composition across risk groups</p>", "o3_s2_out": "<h3>Output Data</h3><p><b>Name:</b> hotspot_characterization.csv</p><p><b>Description:</b> Test results showing significant differences in minority composition across risk groups</p>", "rq_node": "<h3>Research Question</h3><p>How does proximity to hazardous waste facilities influence spatial patterns of asthma prevalence across census tracts of North Carolina, and how do these relationships vary spatially by socioeconomic and demographic context?</p>", "stage_0": "<h3>Result Collation</h3><p>Collate outputs and results from all objectives into a unified dataset for analysis.</p>", "stage_1": "<h3>Results Analysis</h3><p>Perform statistical analysis, validation, and interpretation of the collated results.</p>", "stage_2": "<h3>Discussion of Results</h3><p>Synthesise findings, compare with hypotheses, and discuss implications.</p>", "stage_3": "<h3>Manuscript</h3><p>Final research deliverable: paper, report, or document combining all findings.</p>", "obj_title_1": "<h3>Objective 1</h3><p><b>Title:</b> Understand the spatial relationship between hazardous waste facility proximity and asthma prevalence in North Carolina census tracts</p><p><b>Hypothesis:</b> Census tracts with closer proximity to hazardous waste facilities exhibit higher asthma prevalence rates, controlling for basic demographic factors</p><p><b>Steps:</b></p><ol><li><b>extract_centroids</b>: Generate centroids for census tract geometries</li><li><b>nearest_neighbor_analysis</b>: Calculate distance from tract centroids to nearest hazardous waste facility</li><li><b>join_datasets</b>: Join tract hazard distances with asthma prevalence data using GEOID</li></ol>", "obj_title_2": "<h3>Objective 2</h3><p><b>Title:</b> Quantify how socioeconomic and demographic factors modify the relationship between environmental proximity and asthma outcomes</p><p><b>Hypothesis:</b> The association between hazardous waste proximity and asthma prevalence varies significantly by median household income and racial composition across census tracts</p><p><b>Steps:</b></p><ol><li><b>filter_columns</b>: Select socioeconomic variables: median_household_income, percent_minority, percent_children</li><li><b>join_datasets</b>: Integrate demographic variables with existing spatial and health data using GEOID</li><li><b>geographically_weighted_regression</b>: Analyze spatially varying relationships between proximity (hazard_meters), demographics (minority_pct) and asthma (prevalence_rate)</li></ol>", "obj_title_3": "<h3>Objective 3</h3><p><b>Title:</b> Identify census tracts with statistically significant high-risk clusters of environmental exposure and health outcomes</p><p><b>Hypothesis:</b> Tracts with &lt; 20% minority populations will show stronger spatial clustering of high-risk combinations</p><p><b>Steps:</b></p><ol><li><b>hotspot_analysis</b>: Calculate Gi* statistics for combined variables hazard_meters and asthma_prevalence_rate</li><li><b>kruskal_wallis_test</b>: Compare median minority_pct between hotspot and non-hotspot tracts using Kruskal-Wallis H-test</li></ol>"};
const nodeNames = {"o1_s1_i0": "NC_tract", "o1_s1_op": "extract_centroids", "o1_s1_out": "tract_centroids.gpkg", "o1_s2_i0": "NC_HW_sites", "o1_s2_op": "nearest_neighbor_analysis", "o1_s2_out": "tract_hazard_distance.csv", "o1_s3_i0": "NC_PLACES", "o1_s3_op": "join_datasets", "o1_s3_out": "merged_tract_data.csv", "o2_s1_i0": "NC_ACS_data", "o2_s1_op": "filter_columns", "o2_s1_out": "filtered_ACS_vars.csv", "o2_s2_op": "join_datasets", "o2_s2_out": "final_analysis_dataset.gpkg", "o2_s3_op": "geographically_weighted_regression", "o2_s3_out": "gwr_coefficients.csv", "o3_s1_op": "hotspot_analysis", "o3_s1_out": "risk_hotspots.gpkg", "o3_s2_op": "kruskal_wallis_test", "o3_s2_out": "hotspot_characterization.csv", "rq_node": "How does proximity to hazardous waste facilities influence spatial patterns of asthma prevalence across census tracts of North Carolina, and how do these relationships vary spatially by socioeconomic and demographic context?", "stage_0": "Result Collation", "stage_1": "Results Analysis", "stage_2": "Discussion of Results", "stage_3": "Manuscript", "obj_title_1": "Understand the spatial relationship between hazardous waste facility proximity and asthma prevalence in North Carolina census tracts", "obj_title_2": "Quantify how socioeconomic and demographic factors modify the relationship between environmental proximity and asthma outcomes", "obj_title_3": "Identify census tracts with statistically significant high-risk clusters of environmental exposure and health outcomes"};

let scale=1, panX=0, panY=0, isPanning=false, _wasDragged=false, psX=0, psY=0, _mdX=0, _mdY=0;
const PT=4;
const MN=0.2, MX=5, ZS=0.15;
const svg=document.getElementById('flowchartSvg');
const zg=document.getElementById('zoomGroup');
const gp=document.getElementById('graphPanel');
const tooltip=document.getElementById('nodeTooltip');

function applyTransform(){
  zg.setAttribute('transform','translate('+panX+','+panY+') scale('+scale+')');
  document.getElementById('zoomLevel').textContent=Math.round(scale*100)+'%';
}
function zoomIn(){ scale=Math.min(MX,scale+ZS); applyTransform(); }
function zoomOut(){ scale=Math.max(MN,scale-ZS); applyTransform(); }
function zoomReset(){ scale=1;panX=0;panY=0;applyTransform(); }
function zoomFit(){
  var b=zg.getBBox(),v=svg.viewBox.baseVal,p=30;
  scale=Math.min((v.width-p*2)/b.width,(v.height-p*2)/b.height,MX);
  panX=(v.width/scale-b.width)/2-b.x+p/scale;
  panY=(v.height/scale-b.height)/2-b.y+p/scale;
  applyTransform();
}

gp.addEventListener('wheel',function(e){
  e.preventDefault();
  var r=svg.getBoundingClientRect(),v=svg.viewBox.baseVal;
  var sx=((e.clientX-r.left)/r.width)*v.width, sy=((e.clientY-r.top)/r.height)*v.height;
  var os=scale;
  scale=e.deltaY<0?Math.min(MX,scale+ZS):Math.max(MN,scale-ZS);
  panX=sx/scale-sx/os+panX; panY=sy/scale-sy/os+panY; applyTransform();
},{passive:false});

gp.addEventListener('mousedown',function(e){
  if(e.button===0||e.button===1){
    e.preventDefault();isPanning=true;_wasDragged=false;
    psX=e.clientX;psY=e.clientY;_mdX=e.clientX;_mdY=e.clientY;
    gp.style.cursor='grabbing';
  }
});
window.addEventListener('mousemove',function(e){
  if(!isPanning)return;
  var dist=Math.abs(e.clientX-_mdX)+Math.abs(e.clientY-_mdY);
  if(dist>PT)_wasDragged=true;
  var v=svg.viewBox.baseVal,r=svg.getBoundingClientRect();
  panX+=(e.clientX-psX)*(v.width/r.width)/scale;
  panY+=(e.clientY-psY)*(v.height/r.height)/scale;
  psX=e.clientX;psY=e.clientY;applyTransform();
});
window.addEventListener('mouseup',function(){ if(isPanning){isPanning=false;gp.style.cursor='';} });
gp.addEventListener('click',function(e){ if(_wasDragged){e.stopPropagation();_wasDragged=false;} },true);

// ── Hover highlight: direct connections only ──
function getConnected(nid){
  var edges=document.querySelectorAll('.edge-line');
  var visited={};
  var connEdges=[];
  visited[nid]=true;
  edges.forEach(function(e){
    var f=e.getAttribute('data-from'), t=e.getAttribute('data-to');
    if(f===nid){ connEdges.push(e); visited[t]=true; }
    if(t===nid){ connEdges.push(e); visited[f]=true; }
  });
  return {nodes:visited, edges:connEdges};
}

function hlNode(nid){
  var conn=getConnected(nid);
  // Highlight connected edges
  document.querySelectorAll('.edge-line').forEach(function(e){
    if(conn.edges.indexOf(e)>=0) e.classList.add('highlighted');
  });
  // Dim unconnected nodes
  document.querySelectorAll('.node-box').forEach(function(g){
    var id=g.getAttribute('data-nid');
    if(id && !conn.nodes[id]) g.classList.add('dimmed');
  });
  // Tooltip
  var name=nodeNames[nid]||'';
  if(name){
    tooltip.textContent=name;
    tooltip.style.display='block';
  }
}

function ulNode(){
  document.querySelectorAll('.edge-line.highlighted').forEach(function(e){ e.classList.remove('highlighted'); });
  document.querySelectorAll('.node-box.dimmed').forEach(function(g){ g.classList.remove('dimmed'); });
  tooltip.style.display='none';
}

// Position tooltip near cursor
document.addEventListener('mousemove',function(e){
  if(tooltip.style.display==='block'){
    tooltip.style.left=(e.clientX+12)+'px';
    tooltip.style.top=(e.clientY-28)+'px';
  }
});

function showPopup(nodeId){
  var c=document.getElementById('popupContent');
  var o=document.getElementById('popupOverlay');
  c.innerHTML=details[nodeId]||'<p style="color:#999">No details.</p>';
  o.classList.add('visible');
  document.querySelectorAll('.node-box ellipse,.node-box rect').forEach(function(el){
    el.setAttribute('stroke',el.getAttribute('data-os')||'#333');
    el.setAttribute('stroke-width',el.tagName==='rect'?'2':'1.5');
  });
  var cl=event.currentTarget.querySelector('ellipse,rect');
  if(cl){ cl.setAttribute('stroke-width','3.5'); cl.setAttribute('stroke','#FFD700'); }
}
function closePopup(e){
  if(e&&e.target!==document.getElementById('popupOverlay'))return;
  document.getElementById('popupOverlay').classList.remove('visible');
  document.querySelectorAll('.node-box ellipse,.node-box rect').forEach(function(el){
    el.setAttribute('stroke',el.getAttribute('data-os')||'#333');
    el.setAttribute('stroke-width',el.tagName==='rect'?'2':'1.5');
  });
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape')closePopup(); });
window.addEventListener('DOMContentLoaded',function(){ setTimeout(zoomFit,100); });
</script>
